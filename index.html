<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 1s ease-out;
        }
        
        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #ff7e5f, #feb47b, #86a8e7, #91eae4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.8;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }
        
        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4/3;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .gallery-item:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1s cubic-bezier(0.2, 0, 0.2, 1);
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        .gallery-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.8));
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 1;
        }
        
        .gallery-item:hover::before {
            opacity: 1;
        }
        
        .item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 25px;
            z-index: 2;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .gallery-item:hover .item-overlay {
            transform: translateY(0);
            opacity: 1;
        }
        
        .item-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .item-date {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .view-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .gallery-item:hover .view-btn {
            opacity: 1;
            transform: scale(1);
        }
        
        .view-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
        
        /* 灯箱模态框 */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        
        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }
        
        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .lightbox.active .lightbox-content img {
            transform: scale(1);
            opacity: 1;
        }
        
        .lightbox-close, .lightbox-prev, .lightbox-next {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            font-size: 1.2rem;
        }
        
        .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        .lightbox-close {
            top: 20px;
            right: 20px;
        }
        
        .lightbox-prev {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .lightbox-next {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .image-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .image-info {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 0 20px;
        }
        
        .image-title {
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }
        
        .image-desc {
            font-size: 1rem;
            opacity: 0.8;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .footer {
            text-align: center;
            padding: 40px 0 20px;
            font-size: 0.9rem;
            opacity: 0.6;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }
        
        /* 响应式设计 */
        @media (max-width: 1100px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }
            
            .gallery {
                grid-template-columns: 1fr;
                max-width: 500px;
                margin-left: auto;
                margin-right: auto;
            }
            
            .lightbox-prev, .lightbox-next {
                width: 40px;
                height: 40px;
            }
            
            .lightbox-close {
                top: 10px;
                right: 10px;
            }
        }
        
        /* 加载动画 */
        .gallery-item.loading {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>作品展示</h1>
            <p>点击任意图片查看大图，使用键盘左右箭头浏览所有作品</p>
        </header>
        
        <div class="gallery" id="gallery">
            <!-- 图片项将通过JavaScript动态生成 -->
        </div>
        
        <div class="lightbox" id="lightbox">
            <button class="lightbox-close" id="closeLightbox">&times;</button>
            <button class="lightbox-prev" id="prevImage">‹</button>
            <div class="lightbox-content">
                <img id="lightboxImage" src="" alt="">
                <div class="image-info">
                    <h2 id="lightboxTitle" class="image-title"></h2>
                    <p id="lightboxDesc" class="image-desc"></p>
                </div>
                <div id="imageCounter" class="image-counter"></div>
            </div>
            <button class="lightbox-next" id="nextImage">›</button>
        </div>
        
        <footer class="footer">
            <p>使用键盘方向键 ← → 浏览图片 | ESC键关闭大图</p>
        </footer>
    </div>

    <script>
        // 图片数据 - 请根据你的实际图片修改这里的文件名和描述
        const images = [
            { 
                filename: "克洛希娅.jpg", 
                title: "项目一：现代网页设计", 
                description: "响应式网页设计，采用现代UI/UX设计理念",
                date: "2024年1月"
            },
            { 
                filename: "project2.jpg", 
                title: "项目二：移动应用界面", 
                description: "跨平台移动应用设计，注重用户体验和交互流畅性",
                date: "2024年2月"
            },
            { 
                filename: "project3.jpg", 
                title: "项目三：品牌视觉系统", 
                description: "完整的企业品牌视觉识别系统设计",
                date: "2024年3月"
            },
            { 
                filename: "project4.jpg", 
                title: "项目四：数据可视化面板", 
                description: "交互式数据可视化界面，支持实时数据更新",
                date: "2024年4月"
            },
            { 
                filename: "project5.jpg", 
                title: "项目五：电商平台设计", 
                description: "完整的电子商务平台界面与用户体验设计",
                date: "2024年5月"
            },
            { 
                filename: "project6.jpg", 
                title: "项目六：插画作品集", 
                description: "数字插画与平面设计作品展示",
                date: "2024年6月"
            }
        ];
        
        // 获取DOM元素
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxDesc = document.getElementById('lightboxDesc');
        const closeLightbox = document.getElementById('closeLightbox');
        const prevImage = document.getElementById('prevImage');
        const nextImage = document.getElementById('nextImage');
        const imageCounter = document.getElementById('imageCounter');
        
        let currentImageIndex = 0;
        
        // 初始化画廊
        function initGallery() {
            gallery.innerHTML = '';
            
            images.forEach((image, index) => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.dataset.index = index;
                
                // 添加加载动画类
                galleryItem.classList.add('loading');
                
                galleryItem.innerHTML = `
                    <img src="images/${image.filename}" alt="${image.title}" loading="lazy" onload="this.parentElement.classList.remove('loading')">
                    <div class="item-overlay">
                        <h3 class="item-title">${image.title}</h3>
                        <p class="item-date">${image.date}</p>
                    </div>
                    <button class="view-btn" aria-label="查看大图">🔍</button>
                `;
                
                // 点击图片打开灯箱
                galleryItem.addEventListener('click', () => openLightbox(index));
                
                // 点击查看按钮也打开灯箱
                const viewBtn = galleryItem.querySelector('.view-btn');
                viewBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLightbox(index);
                });
                
                gallery.appendChild(galleryItem);
            });
            
            // 添加浮动动画到部分项目
            document.querySelectorAll('.gallery-item').forEach((item, index) => {
                if (index % 2 === 0) {
                    item.classList.add('float-animation');
                    item.style.animationDelay = `${index * 0.2}s`;
                }
            });
        }
        
        // 打开灯箱显示大图
        function openLightbox(index) {
            currentImageIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // 防止背景滚动
        }
        
        // 更新灯箱内容
        function updateLightbox() {
            const image = images[currentImageIndex];
            lightboxImage.src = `images/${image.filename}`;
            lightboxTitle.textContent = image.title;
            lightboxDesc.textContent = image.description;
            imageCounter.textContent = `${currentImageIndex + 1} / ${images.length}`;
            
            // 添加图片加载处理
            lightboxImage.onload = () => {
                lightboxImage.style.opacity = 1;
            };
            
            lightboxImage.style.opacity = 0;
        }
        
        // 关闭灯箱
        function closeLightboxFunc() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        // 显示上一张图片
        function showPrevImage() {
            currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
            updateLightbox();
        }
        
        // 显示下一张图片
        function showNextImage() {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            updateLightbox();
        }
        
        // 事件监听
        closeLightbox.addEventListener('click', closeLightboxFunc);
        prevImage.addEventListener('click', showPrevImage);
        nextImage.addEventListener('click', showNextImage);
        
        // 点击灯箱背景关闭
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightboxFunc();
            }
        });
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            
            switch(e.key) {
                case 'Escape':
                    closeLightboxFunc();
                    break;
                case 'ArrowLeft':
                    showPrevImage();
                    break;
                case 'ArrowRight':
                    showNextImage();
                    break;
            }
        });
        
        // 触摸滑动支持
        let touchStartX = 0;
        let touchEndX = 0;
        
        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        lightbox.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            
            if (touchEndX < touchStartX - swipeThreshold) {
                // 向左滑动，下一张
                showNextImage();
            }
            
            if (touchEndX > touchStartX + swipeThreshold) {
                // 向右滑动，上一张
                showPrevImage();
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initGallery();
            
            // 添加一些随机动画延迟
            document.querySelectorAll('.gallery-item').forEach((item, index) => {
                item.style.animationDelay = `${index * 0.1}s`;
            });
        });
    </script>
</body>
</html>
