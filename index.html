<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #fff;
            font-family: sans-serif;
            overflow-x: hidden;
        }
        
        .scroll-container {
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        
        .image-section {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .image-section.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .image-section img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.4s ease;
        }
        
        .image-section img:hover {
            transform: scale(1.02);
        }
        
        /* 指示器 */
        .scroll-indicator {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        
        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator-dot.active {
            background: #333;
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div class="scroll-container" id="scrollContainer">
        <!-- 图片区域将通过JavaScript动态生成 -->
    </div>
    
    <div class="scroll-indicator" id="scrollIndicator"></div>

    <script>
        // 图片文件名数组 - 修改为你的实际文件名
        const imageFiles = [
            '1.jpg',
            '2.jpg',
            '3.jpg',
            '4.jpg',
            '5.jpg',
            '6.jpg'
        ];
        
        const container = document.getElementById('scrollContainer');
        const indicator = document.getElementById('scrollIndicator');
        let currentIndex = 0;
        
        // 创建图片区域
        function createSections() {
            imageFiles.forEach((filename, index) => {
                // 创建图片区域
                const section = document.createElement('div');
                section.className = 'image-section';
                section.id = `section-${index}`;
                
                // 创建图片元素
                const img = document.createElement('img');
                img.src = `images/${filename}`;
                img.alt = `作品 ${index + 1}`;
                img.loading = 'lazy';
                
                // 图片加载完成后显示
                img.onload = () => {
                    img.style.opacity = '1';
                };
                
                section.appendChild(img);
                container.appendChild(section);
                
                // 创建指示器点
                const dot = document.createElement('div');
                dot.className = 'indicator-dot';
                dot.dataset.index = index;
                indicator.appendChild(dot);
                
                // 点击指示器点跳转
                dot.addEventListener('click', () => {
                    scrollToSection(index);
                });
            });
            
            // 初始显示第一张
            setTimeout(() => {
                document.querySelector('.image-section').classList.add('active');
                document.querySelector('.indicator-dot').classList.add('active');
            }, 100);
        }
        
        // 滚动到指定区域
        function scrollToSection(index) {
            const section = document.getElementById(`section-${index}`);
            if (section) {
                section.scrollIntoView({ behavior: 'smooth' });
                currentIndex = index;
                updateActiveStates();
            }
        }
        
        // 更新激活状态
        function updateActiveStates() {
            // 更新图片区域
            document.querySelectorAll('.image-section').forEach((section, index) => {
                const rect = section.getBoundingClientRect();
                const isVisible = rect.top < window.innerHeight * 0.8 && rect.bottom > window.innerHeight * 0.2;
                
                if (isVisible) {
                    section.classList.add('active');
                    currentIndex = index;
                } else {
                    section.classList.remove('active');
                }
            });
            
            // 更新指示器
            document.querySelectorAll('.indicator-dot').forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }
        
        // 节流函数，避免滚动事件触发太频繁
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                if (!inThrottle) {
                    func.apply(this, arguments);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            createSections();
            
            // 滚动事件监听
            container.addEventListener('scroll', throttle(updateActiveStates, 100));
            
            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    scrollToSection(Math.min(currentIndex + 1, imageFiles.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    scrollToSection(Math.max(currentIndex - 1, 0));
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    scrollToSection(0);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    scrollToSection(imageFiles.length - 1);
                }
            });
            
            // 触摸滑动支持
            let touchStartY = 0;
            container.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            });
            
            container.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                const diffY = touchStartY - touchEndY;
                
                if (Math.abs(diffY) > 50) {
                    if (diffY > 0) {
                        // 向上滑动，下一张
                        scrollToSection(Math.min(currentIndex + 1, imageFiles.length - 1));
                    } else {
                        // 向下滑动，上一张
                        scrollToSection(Math.max(currentIndex - 1, 0));
                    }
                }
            });
            
            // 初始检查
            updateActiveStates();
        });
    </script>
</body>
</html>
